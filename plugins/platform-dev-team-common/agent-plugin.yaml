name: platform-dev-team-common
version: 1.3.2
description: Common Claude plugin for development teams - TDD guidance, documentation management, PR management with Mermaid charts, and Jira integration
marketplace_description: Common development team plugin - TDD guidance, documentation management, and PR automation with Mermaid charts
author:
  name: datamaker-kr Organization
homepage: https://github.com/datamaker-kr/synapse-claude-marketplace
repository: https://github.com/datamaker-kr/synapse-claude-marketplace.git
license: SEE LICENSE IN LICENSE
keywords:
  - tdd
  - documentation
  - pr-management
  - mermaid
  - dev-team
  - django
  - backend
  - jira
category: development
tags:
  - backend
  - django
  - drf
  - tdd
  - documentation
  - mermaid
  - pr-automation
interface:
  display_name: Platform Dev Team Common
  short_description: Development workflows for TDD, docs, PRs, changelogs, and Jira.
  long_description: Platform Dev Team Common provides shared development-team workflows for TDD guidance, documentation maintenance, PR title and description generation, Mermaid diagrams, changelog updates, and Jira synchronization.
  capabilities:
    - Interactive
    - Write
  default_prompt: Help me update docs, improve PR metadata, manage changelogs, follow TDD, or sync Jira tickets.
targets:
  codex:
    category: Development
  opencode:
    category: development
commands:
  - ./commands/update-pr-title.md
  - ./commands/update-pr-desc.md
  - ./commands/update-docs.md
  - ./commands/add-changelog.md
  - ./commands/sync-jira-tickets.md
skills:
  - ./skills/changelog-manager/SKILL.md
  - ./skills/commit-with-message/SKILL.md
  - ./skills/docs-analyzer/SKILL.md
  - ./skills/docs-bootstrapper/SKILL.md
  - ./skills/mermaid-expert/SKILL.md
  - ./skills/tdd-workflow/SKILL.md
  - ./skills/jira-sync/SKILL.md
agents:
  - ./agents/docs-manager/SKILL.md
  - ./agents/planner/SKILL.md
  - ./agents/update-pr/SKILL.md
mcp_servers:
  - ./mcp-servers/jira
